[package]
name = "meshfs"
version = "2.3.0"
edition = "2021"
authors = ["Xavier DP <xavier@xavdp.pro>", "PodMesh Team"]
description = "High-performance distributed CAS filesystem and storage engine for PodMesh & Proxmox VE"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }

# Consensus and crash-durable log/state storage for clustered operation.
openraft = { version = "=0.9.21", features = ["serde", "storage-v2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
fuser = { version = "=0.16.0", default-features = false, features = ["abi-7-31"] }
