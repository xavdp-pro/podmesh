[package]
name = "podmesh-manager-ha-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false

[features]
default = []
mariadb = ["podmesh/mariadb"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
podmesh = { path = "../..", default-features = false }

[dev-dependencies]
tempfile = { version = "3", default-features = false }
podmesh = { path = "../..", features = ["mariadb"] }

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
