[package]
name = "podmesh-manager-resident-lab"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
podmesh-manager-ha-lab = { path = "../manager-ha" }
podmesh-manager-network-lab = { path = "../manager-network" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
fs2 = "0.4"
rustix = { version = "1", features = ["fs", "net", "process"] }
# Signed votes (V3-4): the replica signs with its own key, mounted by the host; the same crate and
# version as the PodMesh node, which verifies the certificates the votes assemble into.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }

[dev-dependencies]
tempfile = "3"
hmac = "0.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

# Every decision read and every voter pass verifies each vote's two signatures. The curve arithmetic is
# optimized in the development profile too, so that the timings the process tests measure against the
# control deadline are of the order of a release build's, not a hundred times them.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
