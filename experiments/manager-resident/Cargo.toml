[package]
name = "podmesh-manager-resident-lab"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
podmesh-manager-ha-lab = { path = "../manager-ha" }
podmesh-manager-network-lab = { path = "../manager-network" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
fs2 = "0.4"
rustix = { version = "1", features = ["net", "process"] }

[dev-dependencies]
tempfile = "3"
hmac = "0.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
