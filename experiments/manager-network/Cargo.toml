[package]
name = "podmesh-manager-network-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false

[features]
default = []
mariadb = ["podmesh-manager-ha-lab/mariadb"]

[dependencies]
hmac = "0.12"
podmesh-manager-ha-lab = { path = "../manager-ha" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
podmesh = { path = "../.." }
tempfile = { version = "3", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
