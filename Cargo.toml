[workspace]
# Manager experiments retain their independent lockfiles and build profiles.
exclude = ["experiments/manager-resident", "experiments/manager-ha", "experiments/manager-network"]
members = [
    "crates/meshfs",
    "crates/pmbs",
    "crates/podmesh-cli",
]

[package]
name = "podmesh"
version = "2.4.1"
edition = "2021"
license = "Apache-2.0"
description = "Local Podman operations for human-agent tandems"

[features]
# Enabled by default per SHAPER OS / FUNITS Full MariaDB constitutional law (docs/STORE-CONFIGURATION.md).
default = ["mariadb"]
mariadb = ["dep:mysql"]

[dependencies]
libc = "0.2"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# The MariaDB client, synchronous like the rest of this tree, without TLS or a C compression
# library: the node speaks to a store on its own host, over a loopback address or a local socket.
mysql = { version = "28", default-features = false, features = ["minimal-rust"], optional = true }
# Verification of the authority's Ed25519-signed takeover documents; no key is ever held here.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
# Quorum policy & certificate digest (protocol/memory SHA-256) + Pure BLAKE3 for disk/storage operations (v2.4.1).
sha2 = { version = "0.10", default-features = false }
blake3 = "1.5"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "podmesh-storage-migrate"
path = "src/bin/podmesh-storage-migrate.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
