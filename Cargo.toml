[package]
name = "podmesh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Local Podman operations for human-agent tandems"

[dependencies]
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Verification of the authority's Ed25519-signed takeover documents; no key is ever held here.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
