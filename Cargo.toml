[package]
name = "podmesh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Local Podman operations for human-agent tandems"

[features]
# The MariaDB backend of the durable store (docs/STORE-CONFIGURATION.md). Off by default: the
# packaged node still opens SQLite, and a default build keeps the dependency set it has today.
mariadb = ["dep:mysql"]

[dependencies]
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# The MariaDB client, synchronous like the rest of this tree, without TLS or a C compression
# library: the node speaks to a store on its own host, over a loopback address or a local socket.
mysql = { version = "28", default-features = false, features = ["minimal-rust"], optional = true }
# Verification of the authority's Ed25519-signed takeover documents; no key is ever held here.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
# The digest of an authority quorum policy, which every certificate names (V3-2). Already in the build as
# ed25519-dalek's own hash dependency; named here so the digest does not depend on a child process.
sha2 = { version = "0.10", default-features = false }
